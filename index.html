<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* Telefonda Chrome "Masaüstü sitesi" açıksa sayfa ~980px genişlikte çizilir ve tarayıcı onu ekrana sığdırmak için
   uzaklaştırır; her şey küçülür. Telefon genişliğini bul ve içeriği o oranda büyüt (html.dz + --dz). */
(function () {
  function fit() { try {
    var r = document.documentElement, iw = window.innerWidth, sw = screen.width || 0, vv = window.visualViewport, sc = vv && vv.scale || 1,
        ow = window.outerWidth || 0, coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches, w = 0, why = '';
    if (iw >= 700) {
      if (sw && sw < 700 && iw >= sw * 1.3) { w = sw; why = 'screen'; }
      else if (ow && ow < 700 && iw >= ow * 1.3) { w = ow; why = 'outer'; }
      else if (coarse && sc < 0.8) { w = Math.round(iw * sc); why = 'scale'; }
    }
    var z = w ? iw / w : 0;
    if (z > 1.2) { r.classList.add('dz'); r.style.setProperty('--dz', z.toFixed(3)); } else { r.classList.remove('dz'); r.style.removeProperty('--dz'); }
    window.__dz = 'iw ' + iw + ' · sw ' + sw + ' · ow ' + ow + ' · scale ' + sc.toFixed(2) + ' · dpr ' + (window.devicePixelRatio || 1).toFixed(2) + ' · ' + (coarse ? 'dokunmatik' : 'fare') + ' · zoom ' + (z > 1.2 ? z.toFixed(2) + ' (' + why + ')' : 'yok');
  } catch (e) { window.__dz = 'hata: ' + e.message; } }
  fit(); addEventListener('DOMContentLoaded', fit); addEventListener('load', fit); addEventListener('resize', fit); addEventListener('pageshow', fit);
  setTimeout(fit, 400); if (window.visualViewport) visualViewport.addEventListener('resize', fit);
})();</script>
<style>html.dz body{zoom:var(--dz)}</style>
<style>html.dz body{height:calc(100vh / var(--dz))}</style>
<meta name="theme-color" content="#ffcc00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DHL Almanca">
<title>DHL Almancası</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* DHL Almancası: sarı başlık, kırmızı vurgu, kart görünümlü cümleler. */
:root{
  --bg:#fbf7ec; --surface:#ffffff; --surface2:#f6f1e2; --ink:#1f1a10; --soft:#6b6252; --line:#e6dec8;
  --head:#ffcc00; --head-ink:#2a1f00; --head-soft:#6e5600;
  --accent:#d40511; --accent-ink:#ffffff; --accent-bg:#fde3e4;
  --ok:#15803d; --ok-bg:#dcf2e3; --bad:#b42318; --bad-bg:#fbe4e1; --gold:#9a6b00; --gold-bg:#fff1bf;
  --shadow:0 1px 2px rgba(60,45,0,.06),0 8px 24px rgba(60,45,0,.07);
  --f-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-de:Georgia,'Times New Roman',serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120c; --surface:#1e1b13; --surface2:#262217; --ink:#f1ece0; --soft:#b3a88f; --line:#352f21;
  --head:#3a2f00; --head-ink:#ffe27a; --head-soft:#d1b75c;
  --accent:#ff6b6b; --accent-ink:#2a0606; --accent-bg:#3d1a1a;
  --ok:#5fd28c; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1c19; --gold:#ffd25a; --gold-bg:#3a300f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14120c; --surface:#1e1b13; --surface2:#262217; --ink:#f1ece0; --soft:#b3a88f; --line:#352f21;
  --head:#3a2f00; --head-ink:#ffe27a; --head-soft:#d1b75c;
  --accent:#ff6b6b; --accent-ink:#2a0606; --accent-bg:#3d1a1a;
  --ok:#5fd28c; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1c19; --gold:#ffd25a; --gold-bg:#3a300f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

.head{background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:10}
.head .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand p{margin:0;font-size:12.5px;color:var(--head-soft)}
.hbtn{width:40px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--head-ink) 22%,transparent);background:transparent;color:var(--head-ink);display:grid;place-items:center;flex:none;text-decoration:none;font-size:18px}

main{padding-block:16px 30px}
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.muted{color:var(--soft);font-size:14px}

/* Werkzeugleiste */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;font-size:16px;padding:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-weight:500;opacity:.7;margin-left:4px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--soft)}
.tg[aria-pressed="true"]{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}

/* Satzkarten */
.list{display:flex;flex-direction:column;gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow)}
.sc .top{display:flex;align-items:flex-start;gap:10px}
.num{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:var(--head);color:#2a1f00;font-weight:800;font-size:14px;display:grid;place-items:center}
:root[data-theme="dark"] .num{color:var(--head-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{color:var(--head-ink)}}
.sc .tr{flex:1;font-weight:650;font-size:16px;padding-top:3px}
.star{border:0;background:transparent;font-size:20px;line-height:1;padding:4px;color:var(--line);flex:none}
.star[aria-pressed="true"]{color:#e0a800}
.de{font-family:var(--f-de);font-size:21px;line-height:1.3;margin:10px 0 2px}
.ok{font-size:14px;color:var(--soft);font-style:italic}
.ok b{font-style:normal;font-weight:600}
.hid{filter:blur(7px);user-select:none;cursor:pointer}
.acts{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;font-weight:600}
.sbtn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.lvl{margin-left:auto;font-size:12px;color:var(--soft);display:flex;gap:3px;align-items:center}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lvl i.f{background:var(--ok)}
.notes{margin:10px 0 0;padding:10px 12px;background:var(--surface2);border-radius:12px;font-size:14px;display:grid;gap:4px}
.notes div{display:flex;gap:8px;flex-wrap:wrap}
.notes b{font-family:var(--f-de);font-weight:600;font-size:15px}
.notes .alt{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.empty{text-align:center;padding:40px 10px;color:var(--soft)}

/* Üben */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.mode .e{font-size:26px}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--soft)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
select.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-size:14px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.quiz{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.qtop .bar{flex:1}
.qx{border:0;background:transparent;font-size:14px;color:var(--soft);padding:4px 0;font-weight:600}
.prompt{font-size:20px;font-weight:700;line-height:1.35}
.prompt.de{font-family:var(--f-de);font-weight:400;font-size:23px;margin:0}
.hint{font-size:13px;color:var(--soft)}
.answer{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;font-weight:700;font-size:16px;width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.okb{background:var(--ok);color:#fff}
.btn.badb{background:var(--bad);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;text-align:left;font-size:16px}
.opt.de{font-family:var(--f-de);font-size:18px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.big-audio{align-self:center;width:84px;height:84px;border-radius:50%;border:0;background:var(--head);font-size:34px;color:#2a1f00}
.built{min-height:56px;border:1.5px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.built.right{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.built.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.w{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-family:var(--f-de);font-size:17px;box-shadow:0 1px 0 var(--line)}
.w.used{visibility:hidden}
.fb{font-size:15px;font-weight:600}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.result .e{font-size:48px}
.result h3{margin:0;font-size:24px}

/* Wörter, Muster */
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wi{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.wi:first-child{border-top:0}
.wi .t{flex:1;min-width:0}
.wi .d{font-family:var(--f-de);font-size:18px}
.wi .art{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:5px;font-family:var(--f-ui);vertical-align:2px}
.art.der{background:#dbe8ff;color:#1d5fbf} .art.die{background:#ffe0e8;color:#c0264b} .art.das{background:#dcf5e6;color:#1b7f4a}
.wi .m{font-size:14px;color:var(--soft)}
.wi .o{font-size:12.5px;color:var(--soft);font-style:italic}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);flex:none;font-size:16px}
.pat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.pat h3{margin:0;font-family:var(--f-de);font-size:22px;font-weight:600;color:var(--accent)}
.pat .pm{color:var(--soft);font-size:14px;margin:2px 0 8px}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ex .t{flex:1}
.ex .d{font-family:var(--f-de);font-size:17px}
.ex .m{font-size:13.5px;color:var(--soft)}
.tip{background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}

/* Ekle */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;font-weight:700;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.form input,.form textarea,.form select{border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 12px;font-size:16px;font-weight:400;color:var(--ink)}
.form textarea{min-height:90px;resize:vertical}
.form .de-in{font-family:var(--f-de);font-size:18px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:10px}
details.more summary{font-weight:700;cursor:pointer}
.mine-item{display:flex;gap:8px;align-items:center}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-left:4px;padding-right:4px}
.nav button{border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--soft)}
.nav button .e{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .e{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* Ana sayfa */
button.logo{border:0;cursor:pointer}
.hero{background:linear-gradient(135deg,#ffcc00 0%,#ffb300 100%);color:#2a1f00;border-radius:22px;padding:18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"📦";position:absolute;right:-14px;bottom:-26px;font-size:110px;opacity:.10;transform:rotate(-12deg);pointer-events:none}
.hero .ht{flex:1;min-width:0;position:relative;z-index:1}
.hero small{font-weight:700;opacity:.75;font-size:13px}
.hero h2{margin:2px 0 10px;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.hstats{display:flex;flex-wrap:wrap;gap:6px}
.hstats span{background:rgba(255,255,255,.55);border-radius:999px;padding:4px 10px;font-size:13px}
.ring{width:92px;height:92px;flex:none;position:relative;z-index:1}
.ring circle{fill:none;stroke-width:9}
.ring .rt{stroke:rgba(255,255,255,.55)}
.ring .rf{stroke:#d40511;stroke-linecap:round;transform:rotate(-90deg);transform-origin:42px 42px}
.ring text{font-weight:800;font-size:17px;fill:#2a1f00}
.ring .rs{font-size:9.5px;font-weight:600;opacity:.75}
.cta,.install,.crow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.cta{background:var(--accent);border-color:var(--accent);color:#fff}
.cta .ce,.crow .ce{font-size:28px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18)}
.cta .ct,.crow .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.cta b{font-size:18px}
.cta .ct span{opacity:.9;font-size:14px}
.chev{font-size:26px;line-height:1;opacity:.6}
.install{background:var(--ok-bg);border-color:var(--ok)}
.install>span:first-child{font-size:26px}
.install small{display:block;color:var(--soft);font-size:13px}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{border:0;border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;color:#1f1a10;box-shadow:var(--shadow);min-height:112px}
.tile .te{font-size:28px;margin-bottom:4px}
.tile b{font-size:15px;line-height:1.2}
.tile span:last-child{font-size:12px;opacity:.75;line-height:1.25}
.g1{background:#ffe3e3}.g2{background:#fff0c2}.g3{background:#dff3e4}.g4{background:#e2ecff}.g5{background:#efe3ff}.g6{background:#f3eadb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{filter:brightness(.82) saturate(1.2)}}
:root[data-theme="dark"] .tile{filter:brightness(.82) saturate(1.2)}
@media (max-width:360px){.tiles{grid-template-columns:repeat(2,1fr)}}
.dayq{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--head);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.dayq small{font-weight:700;color:var(--soft)}
.dayq .de{margin:6px 0 2px}
.dtr{font-weight:600}
.cats{display:flex;flex-direction:column;gap:8px}
.crow{margin-top:0;padding:10px 12px}
.crow .ce{background:var(--surface2);font-size:22px}
.crow .ct>span{font-size:12.5px;color:var(--soft)}
.crow .bar{margin-top:5px;height:6px}
/* Anki */
.ahero,.ghero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.ahero .e,.ghero .e{font-size:46px;line-height:1}
.ahero h2,.ghero h2{margin:0;font-size:24px}
.ahero p,.ghero p{margin:0;color:var(--soft);font-size:14.5px}
.acount{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px}
.acount span{padding:4px 10px;border-radius:999px;background:var(--surface2)}
.acount .cn b{color:#1d5fbf}.acount .cl b{color:var(--bad)}.acount .cr b{color:var(--ok)}
.qtop .acount{flex:1;justify-content:flex-end}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rb{border:0;border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#fff;font-size:15px}
.rb span{font-size:11.5px;opacity:.9}
.rb.again{background:#c0262d}.rb.hard{background:#7c6a55}.rb.good{background:#15803d}.rb.easy{background:#1d5fbf}
/* Oyun */
.ghero{background:linear-gradient(160deg,var(--surface) 0%,var(--gold-bg) 100%)}
.grules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.grules span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px}
.gbest{font-size:15px}
.btn.big{font-size:19px;padding:16px}
.ghud{display:flex;align-items:center;gap:10px;font-weight:700}
.ghud .hearts{font-size:18px;letter-spacing:1px}
.ghud .combo{flex:1;color:var(--accent)}
.ghud .pts{background:var(--head);color:#2a1f00;border-radius:999px;padding:4px 12px}
.tbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok);transition:width .1s linear}
.tbar i.low{background:var(--bad)}
.gtag{font-size:13px;font-weight:700;color:var(--soft)}

/* Cihaz kullanımı */
.devcta{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:#1f2328;color:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.devcta .ce{font-size:26px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:#ffcc00}
.devcta .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.devcta b{font-size:17px}.devcta .ct span{opacity:.75;font-size:13.5px}
.devhero{display:flex;gap:14px;align-items:center;background:#1f2328;color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.devhero .e{font-size:42px;width:64px;height:64px;border-radius:18px;background:#ffcc00;display:grid;place-items:center;flex:none}
.devhero h2{margin:0;font-size:22px}.devhero p{margin:4px 0 0;font-size:14px;opacity:.8}
.dno{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:15px;padding:4px 0;margin-bottom:6px}
.devhead h2{margin:2px 0 4px;font-size:22px;line-height:1.25}.devhead p{margin:0;color:var(--soft);font-size:14px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;position:relative;margin-bottom:18px}
.flow li:not(:last-child)::after{content:"↓";position:absolute;left:22px;bottom:-19px;color:var(--soft);font-weight:700}
.flow .sn{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.flow small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.key{display:inline-block;background:#1f2328;color:#ffcc00;border-radius:7px;padding:1px 8px;font-weight:700;font-size:14.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.zebra{background:#2b2f35;border-radius:24px;padding:14px 12px 10px;box-shadow:var(--shadow)}
.zscreen{background:#f4f7fb;color:#111;border-radius:10px;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.ztitle{background:#ffcc00;padding:9px 12px;font-weight:800}
.zopt{display:flex;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid #d6dce5}
.zopt.main{background:#d9f2e0;font-weight:700}
.zn{width:22px;height:22px;border-radius:6px;background:#2b2f35;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.zbtm{text-align:center;color:#8a929c;font-size:11px;font-weight:800;letter-spacing:.3em;margin-top:8px}
.opt-card.main{border:2px solid var(--ok)}
.when{margin-top:8px;font-size:14.5px;font-weight:600}

/* Sabah toplantısı */
.meetcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px;display:flex;flex-direction:column;gap:10px}
.meetcard .mh{display:flex;align-items:center;gap:12px}
.meetcard .ce{font-size:26px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--accent-bg);flex:none}
.meetcard b{display:block;font-size:17px}.meetcard small{color:var(--soft);font-size:13.5px}
.meetcard .btn{padding:11px}
.quiz.meet{align-items:stretch;text-align:center}
.speaker{font-size:84px;line-height:1;margin:10px auto 0;animation:talk 1.2s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){.speaker{animation:none}}
.mprog{font-weight:700;font-size:17px}

/* Diyaloglar */
.dlgcta{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:0;background:linear-gradient(135deg,#5b2bb5,#7c3aed);color:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.dlgcta .ce{font-size:26px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.2)}
.dlgcta .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.dlgcta b{font-size:17px}.dlgcta .ct span{opacity:.85;font-size:13.5px}
.dlghero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#5b2bb5,#7c3aed);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.dlghero .e{font-size:40px;width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.dlghero h2{margin:0;font-size:22px}.dlghero p{margin:4px 0 0;font-size:14px;opacity:.85}
.roles{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:14px;color:var(--soft)}
.roles b{color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:88%;border-radius:18px;padding:10px 12px;border:1px solid var(--line);box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.bub.them{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--gold-bg);border-color:color-mix(in srgb,var(--gold) 35%,transparent);border-bottom-right-radius:6px}
.bub.playing{box-shadow:0 0 0 3px var(--accent);transform:scale(1.01)}
.bub .who{font-size:12.5px;font-weight:800;color:var(--soft);margin-bottom:2px}
.bub .de{font-size:19px;margin:2px 0 4px}
.btr{font-size:14.5px}
.btr.big{font-size:17px;font-weight:700;margin:4px 0}
.bub .acts{margin-top:6px}
.bub .sbtn{padding:4px 9px}
/* Rol yaparken düğme alttaki menünün üstünde hep görünür kalsın */
.dspace{height:30vh}
.dctrl{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:6;padding:14px 0 10px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
</style>

const KEY = 'dhl.v1'; // tarayıcıda yalnızca bu uygulamanın kaydı
let P = { mine: [], star: {}, box: {}, seen: {}, hide: '' };
try { Object.assign(P, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

function all() {
  const base = BASE.map(([n, cat, tr, de, ok, notes, alt]) => ({ id: 'b' + n, n, cat, tr, de, ok, notes: notes || [], alt }));
  const mine = P.mine.map((m, i) => ({ ...m, n: BASE.length + i + 1, cat: m.cat || 'mine', notes: m.notes || [], mine: true }));
  return base.concat(mine);
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => (s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i').replace(/ß/g, 'ss');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = s => document.querySelector(s);
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2200); }

// ---------- Ses ----------
const synth = window.speechSynthesis;
let deVoice = null;
function pickVoice() { if (!synth) return; const v = synth.getVoices(); deVoice = v.find(x => /^de(-|_)DE/i.test(x.lang) && /google|natural|premium|enhanced/i.test(x.name)) || v.find(x => /^de(-|_)DE/i.test(x.lang)) || v.find(x => /^de/i.test(x.lang)) || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!synth) { toast('Bu tarayıcı seslendirmeyi desteklemiyor.'); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/…/g, ''));
  u.lang = 'de-DE'; if (deVoice) u.voice = deVoice; u.rate = slow ? 0.6 : 0.92;
  synth.speak(u);
}

function card(s) {
  const hideDe = P.hide === 'de', hideTr = P.hide === 'tr';
  const notes = s.notes.length || s.alt ? `<div class="notes">${s.notes.map(([d, t]) => `<div><b>${esc(d)}</b><span>${esc(t)}</span></div>`).join('')}${s.alt ? `<div class="alt"><span>Alternatif:</span> <b>${esc(s.alt[0])}</b><span>(${esc(s.alt[1])})</span></div>` : ''}</div>` : '';
  return `<article class="sc" data-id="${s.id}">
    <div class="top"><span class="num">${s.n}</span><div class="tr ${hideTr ? 'hid' : ''}" data-reveal>${esc(s.tr)}</div>
      <button class="star" data-star="${s.id}" aria-pressed="${!!P.star[s.id]}" aria-label="Yıldızla">★</button></div>

const stripP = w => w.replace(/[.,!?;:]+$/, '');

// ---------- Günlük kayıt ve düzey ----------
const DAY = 864e5, MIN = 6e4;
const dkey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const today = () => dkey(new Date());
P.srs = P.srs || {}; P.days = P.days || {}; P.best = P.best || 0; P.newDay = P.newDay || { d: '', n: 0 };
P.anki = Object.assign({ dir: 'tr', perDay: 10, set: 'all' }, P.anki || {});
P.game = Object.assign({ dir: 'mix', speed: 12 }, P.game || {});
function logDay() { const t = today(); P.days[t] = (P.days[t] || 0) + 1; }
function streak() { let n = 0; const d = new Date(); if (!P.days[today()]) d.setDate(d.getDate() - 1); while (P.days[dkey(d)]) { n++; d.setDate(d.getDate() - 1); } return n; }
function level(id) { const c = P.srs[id], a = c ? (c.ivl >= 21 ? 4 : c.ivl >= 7 ? 3 : c.ivl >= 3 ? 2 : c.ivl >= 1 ? 1 : 0) : 0; return Math.max(a, Math.min(4, box(id))); }
const fmtIvl = ms => ms < 60 * MIN ? Math.max(1, Math.round(ms / MIN)) + ' dk' : ms < DAY ? Math.round(ms / (60 * MIN)) + ' sa' : ms < 30 * DAY ? Math.round(ms / DAY) + ' gün' : (ms / (30 * DAY)).toFixed(1).replace('.0', '') + ' ay';

// ---------- Anki (aralıklı tekrar) ----------
let A = null; // { id, shown, d, n }
function ankiPool() { const k = P.anki.set, S = all(); return k === 'all' ? S : k === 'star' ? S.filter(s => P.star[s.id]) : S.filter(s => s.cat === k); }
function newLeft() { if (P.newDay.d !== today()) P.newDay = { d: today(), n: 0 }; return Math.max(0, P.anki.perDay - P.newDay.n); }
function ankiCounts() {
  const now = Date.now(); let learn = 0, rev = 0, fresh = 0;
  for (const s of ankiPool()) { const c = P.srs[s.id]; if (!c) fresh++; else if (c.due <= now + 20 * MIN) c.ivl ? rev++ : learn++; }
  return { learn, rev, fresh: Math.min(fresh, newLeft()), freshAll: fresh };
}
function ankiNext() {
  const now = Date.now(), pool = ankiPool(), byDue = (a, b) => P.srs[a.id].due - P.srs[b.id].due;
  const due = pool.filter(s => P.srs[s.id] && P.srs[s.id].due <= now).sort(byDue);
  if (due.length) return due[0];
  if (newLeft()) { const n = pool.find(s => !P.srs[s.id]); if (n) return n; }
  return pool.filter(s => P.srs[s.id] && P.srs[s.id].due <= now + 20 * MIN).sort(byDue)[0] || null;
}
// r: 0 Tekrar, 1 Zor, 2 İyi, 3 Kolay
function schedule(old, r, now) {
  const c = old ? { ...old } : { ivl: 0, ease: 2.5, step: 0, reps: 0, lapses: 0 };
  if (!c.ivl) {
    if (r === 0) { c.step = 0; c.due = now + MIN; }
    else if (r === 1) c.due = now + 6 * MIN;
    else if (r === 2) { if (c.step) { c.ivl = 1; c.due = now + DAY; } else { c.step = 1; c.due = now + 10 * MIN; } }
    else { c.ivl = 4; c.due = now + 4 * DAY; }
  } else if (r === 0) { c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = 0; c.step = 1; c.due = now + 10 * MIN; }
  else {
    if (r === 1) { c.ivl = Math.max(c.ivl + 1, c.ivl * 1.2); c.ease = Math.max(1.3, c.ease - 0.15); }
    else if (r === 2) c.ivl = Math.max(c.ivl + 1, c.ivl * c.ease);
    else { c.ivl = Math.max(c.ivl + 2, c.ivl * c.ease * 1.3); c.ease += 0.15; }
    c.ivl = Math.round(c.ivl); c.due = now + c.ivl * DAY;
  }
  c.reps++; return c;
}
function ankiLoad() { const s = ankiNext(); A = s ? { id: s.id, shown: false, d: P.anki.dir === 'mix' ? (Math.random() < .5 ? 'tr' : 'de') : P.anki.dir, n: A ? A.n : 0 } : { done: true, n: A ? A.n : 0 }; if (s && A.d === 'de') setTimeout(() => say(s.de), 250); }
function viewAnki() {
  const c = ankiCounts();
  const counts = `<div class="acount"><span class="cn">Yeni <b>${c.fresh}</b></span><span class="cl">Öğreniliyor <b>${c.learn}</b></span><span class="cr">Tekrar <b>${c.rev}</b></span></div>`;
  if (!A) {
    const sets = [['all', 'Tüm cümleler'], ['star', '★ Yıldızlılar'], ...CATS.filter(k => k[0] !== 'mine' || P.mine.length).map(k => [k[0], k[2] + ' ' + k[1]])]
      .map(([k, n]) => `<option value="${k}" ${P.anki.set === k ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const total = c.fresh + c.learn + c.rev;
    return `<section class="ahero"><div class="e">🧠</div><h2>Anki ile çalış</h2><p>Bildiğin cümleler seyrek, zorlandıkların sık gelir. Her gün birkaç dakika yeter.</p>${counts}
        <button class="btn" data-astart ${total ? '' : 'disabled style="opacity:.5"'}>${total ? `Başla · ${total} kart` : 'Bugünlük kart kalmadı 🎉'}</button></section>
      <h2 class="sec">Ayarlar</h2>

let G = null, gTimer = 0;
function gStop() { clearInterval(gTimer); gTimer = 0; }
function gameStart() {
  gStop();
  G = { deck: shuffle(all()), i: 0, lives: 3, score: 0, combo: 0, right: 0, wrong: [], q: null, over: false };
  gameQ();
}
function gameQ() {
  if (G.i >= G.deck.length) { G.deck = shuffle(G.deck); G.i = 0; }
  const s = G.deck[G.i++], d = P.game.dir === 'mix' ? (Math.random() < .5 ? 'tr' : 'de') : P.game.dir, key = d === 'tr' ? 'de' : 'tr';
  const same = shuffle(all().filter(x => x.id !== s.id && x.cat === s.cat && x[key] !== s[key])).map(x => x[key]);
  const rest = shuffle(all().filter(x => x.id !== s.id && x[key] !== s[key])).map(x => x[key]);
  const opts = [...new Set([...same.slice(0, 2), ...rest])].filter(o => o !== s[key]).slice(0, 3);
  G.q = { s, d, key, opts: shuffle([s[key], ...opts]), picked: null, end: Date.now() + P.game.speed * 1000 };
  render(); if (d === 'de') say(s.de);
  gStop(); gTimer = setInterval(gTick, 100);
}
function gTick() {
  if (!G || !G.q || G.q.picked != null) return gStop();
  const left = G.q.end - Date.now(), bar = $('#gbar');
  if (bar) { const p = Math.max(0, left / (P.game.speed * 1000)); bar.style.width = (p * 100) + '%'; bar.classList.toggle('low', p < .3); }
  if (left <= 0) gameAnswer(-1);
}
function gameAnswer(i) {
  const q = G.q; if (q.picked != null) return; gStop();
  q.picked = i; const ok = i >= 0 && q.opts[i] === q.s[q.key];
  if (ok) {
    G.combo++; G.right++;
    const mult = G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1, bonus = Math.max(0, Math.ceil((q.end - Date.now()) / 1000));
    q.gain = (10 + bonus) * mult; G.score += q.gain;
    P.box[q.s.id] = Math.min(5, box(q.s.id) + 1);
  } else {
    G.combo = 0; G.lives--; G.wrong.push(q.s); P.box[q.s.id] = 0;
    if (P.srs[q.s.id]) P.srs[q.s.id].due = Math.min(P.srs[q.s.id].due, Date.now());
  }
  P.seen[q.s.id] = 1; logDay();
  if (G.lives <= 0) { G.over = true; G.record = G.score > P.best; if (G.record) P.best = G.score; }
  save(); render();
  if (q.d === 'tr' || !ok) say(q.s.de);
  if (ok && !G.over) setTimeout(() => { if (G && G.q === q) gameQ(); }, 1100);
}

    chat += bubble(g, D.i, { hideDe: true });
    ctrl = `<div class="dctrl"><button class="btn" data-dshow>Söyledim, doğrusunu göster</button></div>`;
  } else {
    chat += bubble(g, D.i);
    ctrl = `<div class="dctrl"><button class="btn" data-dnext>${D.i + 1 < g.lines.length ? 'Devam →' : 'Bitir'}</button></div>`;
  }
  return `${head}${pick}<p class="hint" style="margin:10px 0 0">${D.me === 'both' ? 'Her repliği sen söyle. Ayağa kalk, gerçekten oynuyormuş gibi!' : `Sen <b>${esc(meName)}</b>sın. Karşı tarafı dinle, kendi repliğini Türkçesine bakarak sesli söyle.`}</p>
    <div class="chat">${chat}</div>${ctrl}<div class="dspace"></div>`;
}
// Son balon, alttaki sabit düğmenin hemen üstünde görünsün (Masaüstü sitesi yakınlaştırmasında da)
function dlgReveal() {
  requestAnimationFrame(() => {
    const r = document.querySelector('.result');
    if (r) { r.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const last = document.querySelector('.chat .bub:last-child'), ctrl = document.querySelector('.dctrl .btn'), head = document.querySelector('.head');
    if (!last || !ctrl) return;
    const lb = last.getBoundingClientRect(), cb = ctrl.getBoundingClientRect(), top = head ? head.getBoundingClientRect().bottom : 0;
    let dy = lb.bottom - (cb.top - 12);
    if (lb.top - dy < top + 8) dy = lb.top - top - 8; // çok uzun balonda başı görünsün
    if (Math.abs(dy) > 2) scrollBy({ top: dy, behavior: 'smooth' });
  });
}
function dlgStep() {
  const g = DIALOGS.find(x => x.no === D.no);
  if (D.i >= g.lines.length) return;
  const mineNow = D.me === 'both' || g.lines[D.i][0] === D.me;
  if (!mineNow) { const [r, de] = g.lines[D.i]; synth && synth.cancel(); sayAs(de, g.roles[r].pitch); }
}

// ---------- Ana sayfa ----------
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (tab === 'home') render(); });
addEventListener('appinstalled', () => { installEvt = null; toast('Uygulama yüklendi!'); if (tab === 'home') render(); });
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
function ring(p) {
  const r = 34, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 84 84" aria-label="%${p} öğrenildi"><circle cx="42" cy="42" r="${r}" class="rt"/><circle cx="42" cy="42" r="${r}" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/><text x="42" y="40" text-anchor="middle">%${p}</text><text x="42" y="55" text-anchor="middle" class="rs">öğrenildi</text></svg>`;
}
function viewHome() {
  const S = all(), learned = S.filter(s => level(s.id) >= 3).length, p = Math.round(100 * learned / S.length);
  const h = new Date().getHours(), greet = h < 11 ? ['Guten Morgen!', 'Günaydın'] : h < 17 ? ['Guten Tag!', 'İyi günler'] : ['Guten Abend!', 'İyi akşamlar'];
  const st = streak(), c = ankiCounts(), due = c.fresh + c.learn + c.rev;
  const dq = S[Math.floor(Date.now() / DAY) % BASE.length];
  const tiles = [
    ['game', '🎮', 'Oyun', P.best ? `Rekor: ${P.best}` : 'Paket Yarışı', 'g1'],
    ['learn', '🎯', 'Alıştırmalar', 'Seç, dinle, cümle kur', 'g2'],
    ['list', '💬', 'Cümleler', `${S.length} cümle`, 'g3'],
    ['words', '📖', 'Kelimeler', `${WORDS.length} kelime`, 'g4'],
    ['pat', '🧩', 'Kalıplar', `${PATTERNS.length} soru kalıbı`, 'g5'],
    ['add', '✏️', 'Cümle ekle', 'Kendi cümlelerin', 'g6'],
  ].map(([t, e, n, sub, g]) => `<button class="tile ${g}" data-tab="${t}"><span class="te">${e}</span><b>${n}</b><span>${esc(sub)}</span></button>`).join('');
  const cats = CATS.filter(k => S.some(s => s.cat === k[0])).map(([k, n, e]) => {
    const r = S.filter(s => s.cat === k), l = r.filter(s => level(s.id) >= 3).length, cp = Math.round(100 * l / r.length);
    return `<button class="crow" data-catgo="${k}"><span class="ce">${e}</span><span class="ct"><b>${esc(n)}</b><span>${l} / ${r.length} öğrenildi</span><span class="bar"><i style="width:${cp}%"></i></span></span><span class="chev">›</span></button>`;
  }).join('');
  const install = isStandalone() ? '' : installEvt
    ? `<button class="install" data-install><span>📲</span><span><b>Telefona uygulama olarak yükle</b><small>Ana ekranda kendi ikonuyla açılır, internetsiz çalışır</small></span></button>`
    : `<details class="more"><summary>📲 Telefona nasıl yüklenir?</summary><ol class="steps">
        <li>Chrome menüsünü (⋮) aç. <b>Masaüstü sitesi</b> işaretliyse işareti kaldır.</li>
        <li>Menüde <b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seç.</li>
        <li>Bu seçenekler yoksa sayfayı bir kez yenile ve tekrar bak.</li></ol></details>`;
  return `<section class="hero">
      <div class="ht"><small>${greet[0]} · ${greet[1]}</small><h2>Bugün ne çalışalım?</h2>
        <div class="hstats"><span>🔥 <b>${st}</b> gün seri</span><span>📦 <b>${learned}</b> / ${S.length} cümle</span></div></div>
      ${ring(p)}
    </section>
    <button class="cta" data-tab="anki"><span class="ce">🧠</span><span class="ct"><b>Anki ile çalış</b><span>${due ? `${due} kart seni bekliyor` : 'Bugünlük tamam, harika! 🎉'}</span></span><span class="chev">›</span></button>
    <section class="meetcard"><div class="mh"><span class="ce">📢</span><span><b>Sabah toplantısı</b><small>Şefin bilgilendirmesini anla</small></span></div>
      <div class="row"><button class="btn" data-tab="meet">🎧 Dinle</button><button class="btn ghost" data-tab="notes">📝 Not al${P.notes[today()] && P.notes[today()].trim() ? ' ✓' : ''}</button></div></section>
    <button class="dlgcta" data-tab="dialog"><span class="ce">🎭</span><span class="ct"><b>Diyaloglar</b><span>Gerçek sahneler · rol yap · ${DIALOGS.length} sahne</span></span><span class="chev">›</span></button>
    <button class="devcta" data-tab="device"><span class="ce">📟</span><span class="ct"><b>Cihaz kullanımı</b><span>Zebra el terminali · ${GUIDES.length} kayıt</span></span><span class="chev">›</span></button>
    ${install}
    <div class="tiles">${tiles}</div>
    <section class="dayq"><small>☀️ Günün cümlesi · No ${dq.n}</small><p class="de" lang="de">${esc(dq.de)}</p><div class="dtr">${esc(dq.tr)}</div>${dq.ok ? `<div class="ok"><b>Okunuşu:</b> ${esc(dq.ok)}</div>` : ''}
      <div class="acts"><button class="sbtn" data-say="${esc(dq.de)}">🔊 Dinle</button><button class="sbtn" data-slow="${esc(dq.de)}">🐢 Yavaş</button></div></section>
    <h2 class="sec">Bölümler</h2>
    <div class="cats">${cats}</div>`;
}

// ---------- Çizim ----------
const SUB = { dialog: 'Diyaloglar', meet: 'Sabah toplantısı', notes: 'Toplantı notu', device: 'Zebra cihaz kılavuzu', home: 'İşte kullanılan Almanca', anki: 'Aralıklı tekrar', game: 'Paket Yarışı', list: 'İşte kullanılan cümleler', learn: 'Alıştırma', words: 'Kelime pratiği', pat: 'Soru kalıpları', add: 'Kendi cümlelerin' };
function render(keepFocus) {
  const app = $('#app');
  const f = keepFocus && document.activeElement && document.activeElement.id, pos = f && document.activeElement.selectionStart;
  app.innerHTML = ({ home: viewHome, dialog: viewDialog, meet: viewMeet, notes: viewNotes, device: viewDevice, list: viewList, anki: viewAnki, game: viewGame, learn: viewLearn, words: viewWords, pat: viewPat, add: viewAdd }[tab] || viewHome)();
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  $('#sub').textContent = SUB[tab];
  if (f && $('#' + f)) { const el = $('#' + f); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
}
function go(t) { if (t !== 'game') { gStop(); G = null; } if (t !== 'anki') A = null; if (t !== 'device') devOpen = null; if (t !== 'meet' && M) { M = null; synth && synth.cancel(); } if (t !== 'dialog' && D) { D = null; synth && synth.cancel(); } tab = t; if (t !== 'learn') Q = null; editId = null; render(); scrollTo(0, 0); try { history.replaceState(null, '', '#' + t); } catch (e) {} }

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-reveal]');
  if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (t.matches('[data-reveal].hid')) { t.classList.remove('hid'); return; }
  if (d.say != null) return say(d.say);
  if (d.slow != null) return say(d.slow, true);
  if (d.star) { P.star[d.star] ? delete P.star[d.star] : P.star[d.star] = 1; save(); t.setAttribute('aria-pressed', !!P.star[d.star]); return; }
  if (d.filter) { filter = d.filter; return render(); }
  if (d.hide) { P.hide = P.hide === d.hide ? '' : d.hide; save(); return render(); }
  if (d.whide != null) { whide = !whide; return render(); }
  if (d.dlg) { D = { no: d.dlg, mode: 'read', me: 'b', i: 0, shown: false, hideTr: false }; render(); return scrollTo(0, 0); }
  if (d.dlgback != null) { synth && synth.cancel(); D = null; render(); return scrollTo(0, 0); }
  if (d.dmode) { synth && synth.cancel(); D.mode = d.dmode; D.i = 0; D.shown = false; render(); scrollTo(0, 0); if (D.mode === 'role') { dlgStep(); dlgReveal(); } return; }
  if (d.dplay != null) return dlgPlayAll(DIALOGS.find(x => x.no === D.no));
  if (d.dhidetr != null) { D.hideTr = !D.hideTr; return render(); }
  if (d.dsay) { const g = DIALOGS.find(x => x.no === D.no), [r, de] = g.lines[+d.dsay]; synth && synth.cancel(); return sayAs(de, g.roles[r].pitch); }
  if (d.dme) { synth && synth.cancel(); D.me = d.dme; D.mode = 'role'; D.i = 0; D.shown = false; render(); scrollTo(0, 0); dlgStep(); return dlgReveal(); }
  if (d.drestart != null) { D.i = 0; D.shown = false; render(); scrollTo(0, 0); dlgStep(); return dlgReveal(); }
  if (d.dshow != null) { const g = DIALOGS.find(x => x.no === D.no), [r, de] = g.lines[D.i]; D.shown = true; logDay(); save(); render(); synth && synth.cancel(); sayAs(de, g.roles[r].pitch); dlgReveal(); return; }
  if (d.dnext != null) { D.i++; D.shown = false; render(); dlgStep(); dlgReveal(); return; }
  if (d.mstart != null) return meetStart();
  if (d.mreplay != null) return meetPlay();
  if (d.mrestart != null) { M.stage = 'listen'; M.right = 0; render(); scrollTo(0, 0); return meetPlay(); }
  if (d.mquiz != null) return meetQuiz();
  if (d.mpick) { const s = M.items[M.i], q = BRIEF_Q[s.n], ok = M.opts[+d.mpick] === q[2]; M.picked = +d.mpick; if (ok) M.right++; else { P.box[s.id] = 0; if (P.srs[s.id]) P.srs[s.id].due = Math.min(P.srs[s.id].due, Date.now()); } P.seen[s.id] = 1; logDay(); save(); say(s.de); return render(); }
  if (d.mnext != null) { M.i++; if (M.i >= M.items.length) M.stage = 'done'; else meetLoadQ(); render(); return scrollTo(0, 0); }
  if (d.mquit != null) { synth && synth.cancel(); M = null; render(); return scrollTo(0, 0); }
  if (d.mslow != null) { P.meet.slow = d.mslow === '1'; save(); return render(); }
  if (d.ncopy) return copyText(noteText(d.ncopy));
  if (d.nshare) { const t = noteText(d.nshare); if (navigator.share) navigator.share({ text: t }).catch(() => {}); else copyText(t); return; }
  if (d.ndel) { if (confirm('Bu not silinsin mi?')) { delete P.notes[d.ndel]; save(); render(); } return; }
  if (d.dev) { devOpen = d.dev; render(); return scrollTo(0, 0); }
  if (d.devback != null) { devOpen = null; render(); return scrollTo(0, 0); }
  if (d.catgo) { filter = d.catgo; query = ''; return go('list'); }
  if (d.install != null) { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } return; }
  if (d.astart != null) { A = null; ankiLoad(); return render(); }
  if (d.ashow != null) { A.shown = true; if (A.d === 'tr') say(all().find(x => x.id === A.id).de); return render(); }
  if (d.rate) return ankiRate(+d.rate);
  if (d.aquit != null) { A = null; render(); return scrollTo(0, 0); }
  if (d.adir) { P.anki.dir = d.adir; save(); return render(); }
  if (d.aper) { P.anki.perDay = +d.aper; save(); return render(); }
  if (d.gstart != null) { gameStart(); return scrollTo(0, 0); }
  if (d.gpick) return gameAnswer(+d.gpick);
  if (d.gnext != null) return gameQ();
  if (d.gquit != null) { gStop(); G = null; return render(); }
  if (d.gdir) { P.game.dir = d.gdir; save(); return render(); }
  if (d.gspeed) { P.game.speed = +d.gspeed; save(); return render(); }
  if (d.mode) return startQuiz(d.mode);
  if (d.quit != null) { Q = null; return render(); }
  if (d.again != null) { const m = Q.mode; Q = null; return startQuiz(m); }
  if (!Q && !d.edit && !d.del && !d.cancel && d.export == null && d.import == null && d.reset == null) return;
  if (d.dir) { dir = d.dir; Q.state = {}; return render(); }
  if (d.show != null) { Q.state.shown = true; if (dir === 'tr') say(Q.items[Q.i].de); return render(); }
  if (d.grade) { grade(Q.items[Q.i], d.grade === '1'); Q.i++; Q.state = {}; return render(); }
  if (d.peek != null) { Q.state.peek = true; return render(); }
  if (d.pick) {
    const s = Q.items[Q.i], key = Q.mode === 'choose' ? 'de' : 'tr', i = +d.pick;
    Q.state.picked = i; grade(s, Q.state.opts[i] === s[key]);
    if (Q.mode === 'choose') say(s.de);
    return render();
  }
  if (d.next != null) { Q.i++; Q.state = {}; return render(); }
  if (d.wpick) { const k = +d.wpick; if (!Q.state.built.includes(k)) Q.state.built.push(k); say(Q.state.pool[k].w); return render(); }
  if (d.unpick) { Q.state.built.splice(+d.unpick, 1); return render(); }
  if (d.clear != null) { Q.state.built = []; return render(); }
  if (d.check != null) {
    const s = Q.items[Q.i], st = Q.state, words = s.de.split(/\s+/).map(stripP);
    st.result = st.built.map(k => st.pool[k].w).join(' ').toLowerCase() === words.join(' ').toLowerCase();
    grade(s, st.result); say(s.de); return render();
  }
  if (d.edit) { editId = d.edit; render(); return scrollTo(0, 0); }
  if (d.cancel != null) { editId = null; return render(); }
  if (d.del) { if (confirm('Bu cümle silinsin mi?')) { P.mine = P.mine.filter(m => m.id !== d.del); delete P.box[d.del]; delete P.star[d.del]; save(); render(); } return; }
  if (d.export != null) {
    const blob = new Blob([JSON.stringify(P, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dhl-almanca-yedek.json'; a.click(); return;
  }
  if (d.import != null) return $('#impf').click();
  if (d.reset != null) { if (confirm('Tüm ilerleme (puanlar ve yıldızlar) sıfırlansın mı? Eklediğin cümleler kalır.')) { P.box = {}; P.seen = {}; P.star = {}; P.srs = {}; P.days = {}; P.best = 0; P.newDay = { d: '', n: 0 }; save(); toast('İlerleme sıfırlandı.'); render(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'note') { P.notes[today()] = e.target.value; save(); return; }
  if (e.target.id === 'q') { query = e.target.value; render(true); }
  if (e.target.id === 'wq') { wq = e.target.value; render(true); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'set') learnSet = e.target.value;
  if (e.target.id === 'mtopic') { P.meet.topic = e.target.value; save(); }
  if (e.target.id === 'aset') { P.anki.set = e.target.value; save(); render(); }
  if (e.target.id === 'impf' && e.target.files[0]) {
    e.target.files[0].text().then(t => { const o = JSON.parse(t); if (!o || !Array.isArray(o.mine)) throw 0; P = Object.assign({ mine: [], star: {}, box: {}, seen: {}, hide: '', srs: {}, days: {}, best: 0, newDay: { d: '', n: 0 }, anki: { dir: 'tr', perDay: 10, set: 'all' }, game: { dir: 'mix', speed: 12 }, notes: {}, meet: { topic: 'mix', slow: false } }, o); save(); toast('Yedek yüklendi.'); render(); })
      .catch(() => toast('Bu dosya okunamadı.'));
  }
});
const parseNotes = t => (t || '').split('\n').map(l => l.split(/\s*[=:]\s*/)).filter(p => p[0] && p[1]).map(p => [p[0].trim(), p.slice(1).join(' ').trim()]);
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, v = n => (f.elements[n]?.value || '').trim();
  if (f.id === 'addf') {
    const item = { tr: v('tr'), de: v('de'), ok: v('ok'), cat: v('cat'), notes: parseNotes(f.elements.notes.value) };
    if (!item.tr || !item.de) return;
    if (editId) { Object.assign(P.mine.find(m => m.id === editId), item); editId = null; toast('Kaydedildi.'); }
    else { P.mine.push({ id: 'm' + Date.now().toString(36), ...item }); toast(`${BASE.length + P.mine.length} numaralı cümle eklendi.`); }
    save(); render();
  }
  if (f.id === 'bulkf') {
    let k = 0;
    f.elements.t.value.split('\n').forEach((l, i) => {
      const p = l.split(/\s*[|;]\s*/).map(x => x.trim());
      if (p[0] && p[1]) { P.mine.push({ id: 'm' + Date.now().toString(36) + i, tr: p[0], de: p[1], ok: p[2] || '', cat: 'mine', notes: [] }); k++; }
    });
    save(); toast(k ? `${k} cümle eklendi.` : 'Satır bulunamadı. Biçim: Türkçe | Almanca'); render();
  }
});

const start = location.hash.slice(1);
if (SUB[start]) tab = start;
render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.claude && window.claude.use)) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
</script>
